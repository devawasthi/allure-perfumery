{% extends "base.html" %}

{% block content %}
  <section class="utility-hero">
    <p class="section-kicker">Checkout</p>
    <h1>Complete your order</h1>
  </section>

  <section
    class="commerce-shell checkout-shell"
    data-checkout-root
    data-razorpay-enabled="{{ 'true' if payment.razorpay_enabled else 'false' }}"
    data-razorpay-key="{{ payment.razorpay_key_id }}"
    data-store-name="{{ site_name }}"
    data-store-logo="{{ site_logo }}"
  >
    <div class="commerce-shell__main">
      <form class="checkout-form" data-checkout-form>
        <div class="checkout-form__grid">
          <label>
            Full name
            <input
              type="text"
              name="customer_name"
              value="{{ current_customer.full_name if current_customer else '' }}"
              placeholder="Your full name"
              autocomplete="name"
              minlength="2"
              required
            />
          </label>
          <label>
            Email
            <input
              type="email"
              name="email"
              value="{{ current_customer.email if current_customer else '' }}"
              placeholder="name@example.com"
              autocomplete="email"
              inputmode="email"
              maxlength="120"
              {% if current_customer %}readonly{% endif %}
              required
            />
          </label>
          <label>
            Phone
            <input
              type="tel"
              name="phone"
              placeholder="10 digit phone number"
              autocomplete="tel"
              inputmode="numeric"
              pattern="[0-9]{10,15}"
              minlength="10"
              maxlength="15"
              required
            />
          </label>
          <label>
            Payment method
            <select name="payment_method" required>
              <option value="Cash on Delivery" {% if not payment.manual_checkout_enabled %}disabled{% endif %}>
                Cash on Delivery
              </option>
              <option value="UPI" {% if not payment.razorpay_enabled %}disabled{% endif %}>UPI</option>
              <option value="Netbanking" {% if not payment.razorpay_enabled %}disabled{% endif %}>Netbanking</option>
              <option value="Credit/Debit Card" {% if not payment.razorpay_enabled %}disabled{% endif %}>
                Credit/Debit Card
              </option>
            </select>
          </label>
        </div>

        <label>
          Shipping address line 1
          <input
            type="text"
            name="shipping_line1"
            placeholder="House number, street, locality"
            autocomplete="address-line1"
            minlength="8"
            required
          />
        </label>

        <label>
          Shipping address line 2
          <input type="text" name="shipping_line2" placeholder="Apartment, landmark, suite (optional)" />
        </label>

        <div class="checkout-form__grid checkout-form__grid--address">
          <label>
            State / Union Territory
            <span class="select-shell checkout-select-shell">
              <select name="state" autocomplete="address-level1" data-state-select data-custom-select required>
                <option value="">Select state</option>
                <option value="Andaman and Nicobar Islands">Andaman and Nicobar Islands</option>
                <option value="Andhra Pradesh">Andhra Pradesh</option>
                <option value="Arunachal Pradesh">Arunachal Pradesh</option>
                <option value="Assam">Assam</option>
                <option value="Bihar">Bihar</option>
                <option value="Chandigarh">Chandigarh</option>
                <option value="Chhattisgarh">Chhattisgarh</option>
                <option value="Dadra and Nagar Haveli and Daman and Diu">Dadra and Nagar Haveli and Daman and Diu</option>
                <option value="Delhi">Delhi</option>
                <option value="Goa">Goa</option>
                <option value="Gujarat">Gujarat</option>
                <option value="Haryana">Haryana</option>
                <option value="Himachal Pradesh">Himachal Pradesh</option>
                <option value="Jammu and Kashmir">Jammu and Kashmir</option>
                <option value="Jharkhand">Jharkhand</option>
                <option value="Karnataka">Karnataka</option>
                <option value="Kerala">Kerala</option>
                <option value="Ladakh">Ladakh</option>
                <option value="Lakshadweep">Lakshadweep</option>
                <option value="Madhya Pradesh">Madhya Pradesh</option>
                <option value="Maharashtra">Maharashtra</option>
                <option value="Manipur">Manipur</option>
                <option value="Meghalaya">Meghalaya</option>
                <option value="Mizoram">Mizoram</option>
                <option value="Nagaland">Nagaland</option>
                <option value="Odisha">Odisha</option>
                <option value="Puducherry">Puducherry</option>
                <option value="Punjab">Punjab</option>
                <option value="Rajasthan">Rajasthan</option>
                <option value="Sikkim">Sikkim</option>
                <option value="Tamil Nadu">Tamil Nadu</option>
                <option value="Telangana">Telangana</option>
                <option value="Tripura">Tripura</option>
                <option value="Uttar Pradesh">Uttar Pradesh</option>
                <option value="Uttarakhand">Uttarakhand</option>
                <option value="West Bengal">West Bengal</option>
              </select>
            </span>
          </label>
          <label>
            City
            <span class="select-shell checkout-select-shell">
              <select data-city-select data-custom-select required disabled>
                <option value="">Select state first</option>
              </select>
            </span>
            <input type="hidden" name="city" data-city-value required />
            <input
              class="checkout-city-other"
              type="text"
              name="city_other"
              data-city-other
              autocomplete="address-level2"
              placeholder="Enter your city"
              minlength="2"
              hidden
            />
          </label>
          <label>
            Postal code
            <input
              type="text"
              name="postal_code"
              autocomplete="postal-code"
              inputmode="numeric"
              pattern="[1-9][0-9]{5}"
              minlength="6"
              maxlength="6"
              required
            />
          </label>
          <label>
            Country
            <span class="select-shell checkout-select-shell">
              <select name="country" autocomplete="country-name" data-custom-select required>
                <option value="India" selected>India</option>
              </select>
            </span>
          </label>
        </div>

        <label>
          Delivery notes
          <textarea name="delivery_notes" rows="4" placeholder="Leave a note for the packing or delivery team"></textarea>
        </label>

        <div class="checkout-form__actions">
          <button type="submit" class="button button--full" data-checkout-submit>
            Continue to payment
          </button>
          <p class="checkout-form__status" data-checkout-status></p>
        </div>
      </form>
    </div>

    <aside class="commerce-shell__sidebar">
      <div class="summary-card">
        <p class="section-kicker">Order Summary</p>
        <div class="summary-card__lines" data-checkout-items></div>
        <div class="summary-card__lines">
          <div><span>Subtotal</span><strong data-checkout-subtotal>{{ 0|money }}</strong></div>
          <div><span>Shipping</span><strong data-checkout-shipping>{{ 350|money }}</strong></div>
          <div class="summary-card__total"><span>Total</span><strong data-checkout-total>{{ 350|money }}</strong></div>
        </div>
      </div>
    </aside>
  </section>
{% endblock %}

{% block scripts %}
  {% if payment.razorpay_enabled %}
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  {% endif %}
{% endblock %}
