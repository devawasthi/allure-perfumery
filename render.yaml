services:
  - type: web
    name: the-scentist
    runtime: docker
    plan: starter
    region: singapore
    healthCheckPath: /readyz
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: SITE_NAME
        value: The Scentist
      - key: BASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: AUTO_SEED_CATALOG
        value: "false"
      - key: ENABLE_MANUAL_CHECKOUT
        value: "true"
      - key: STORE_CURRENCY
        value: INR
      - key: STORE_DEFAULT_COUNTRY
        value: India
      - key: SHIPPING_FEE_INR
        value: "350"
      - key: FREE_SHIPPING_THRESHOLD_INR
        value: "12500"
      - key: ORDER_PREFIX
        value: TSC
      - key: WEB_CONCURRENCY
        value: "2"
      - key: WEB_THREADS
        value: "4"
      - key: WEB_TIMEOUT_SECONDS
        value: "60"
      - key: WEB_GRACEFUL_TIMEOUT_SECONDS
        value: "30"
      - key: WEB_KEEPALIVE_SECONDS
        value: "5"
      - key: WEB_MAX_REQUESTS
        value: "1000"
      - key: WEB_MAX_REQUESTS_JITTER
        value: "100"
      - key: DATABASE_POOL_MIN_SIZE
        value: "1"
      - key: DATABASE_POOL_MAX_SIZE
        value: "4"
      - key: DATABASE_CONNECT_TIMEOUT_SECONDS
        value: "10"
      - key: DATABASE_STATEMENT_TIMEOUT_MS
        value: "5000"
      - key: MAX_REQUEST_BODY_BYTES
        value: "262144"
      - key: STATIC_CACHE_MAX_AGE_SECONDS
        value: "86400"
      - key: LOG_LEVEL
        value: info
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: PAYMENT_RESERVATION_MINUTES
        value: "30"
      - key: APP_SECRET_KEY
        generateValue: true
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: the-scentist-cache
          property: connectionString
      - key: ADMIN_TOKEN
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: NOTIFICATION_FROM_EMAIL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_USE_TLS
        value: "true"
      - key: AI_CONCIERGE_ENABLED
        value: "true"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini

  - type: worker
    name: the-scentist-worker
    runtime: docker
    plan: starter
    dockerCommand: python worker.py
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_POOL_MIN_SIZE
        value: "1"
      - key: DATABASE_POOL_MAX_SIZE
        value: "3"
      - key: PAYMENT_RESERVATION_MINUTES
        value: "30"
      - key: ADMIN_EMAIL
        sync: false
      - key: NOTIFICATION_FROM_EMAIL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_USE_TLS
        value: "true"

  - type: keyvalue
    name: the-scentist-cache
    plan: starter
    region: singapore
    ipAllowList: []
    maxmemoryPolicy: noeviction
